# Opt-in GPU overlay, layered on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
#
# This requires the NVIDIA Container Toolkit on the host. Without it Docker
# fails with: could not select device driver "" with capabilities: [[gpu]]
# Everything except SAM 3 segmentation and Faithful upscaling runs without it.

services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
